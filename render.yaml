services:
  - type: web
    name: roadsight
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python scripts/verify_model.py && python manage.py collectstatic --noinput
    startCommand: gunicorn roadsight.wsgi:application --bind 0.0.0.0:$PORT --log-file -
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: YOLO_MODEL_PATH
        value: /opt/render/project/src/training_runs/detect/pothole_model/weights/best.pt
      - key: YOLO_TARGET_LABELS
        value: pothole,potholes,object,objects
      - key: VIDEO_FRAME_STRIDE
        value: "5"
